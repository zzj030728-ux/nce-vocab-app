<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="英语词库：960+ 词书浏览、点读、生词与间隔复习">
  <title>英语词库</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div>
      <h1 id="header-title">英语词库</h1>
      <p class="subtitle" id="header-sub">全库浏览 · 点读 · 间隔复习</p>
    </div>
  </header>

  <div id="install-banner" class="install-banner" role="status">
    <span>可安装到主屏幕，像 App 一样用</span>
    <div class="install-actions">
      <button type="button" id="install-dismiss" class="linkish">稍后</button>
      <button type="button" id="install-btn" class="btn-primary install-go">安装</button>
    </div>
  </div>

  <div class="container">
    <!-- 词库：分类 -->
    <div id="vault-view">
      <button type="button" id="today-card" class="today-card">
        <div class="today-card-top">
          <span class="today-badge">今日学习</span>
          <span class="today-streak" id="today-card-streak"></span>
        </div>
        <div class="today-card-title" id="today-card-title">分级路径 · 每天一课</div>
        <div class="today-card-sub" id="today-card-sub">点此查看今天学什么</div>
      </button>
      <div class="search-bar">
        <input type="search" id="vault-search" placeholder="搜索分类或词书…" autocomplete="off">
      </div>
      <div id="category-grid" class="category-grid"></div>
    </div>

    <!-- 今日学习路径 -->
    <div id="today-view" style="display:none;">
      <button class="back-btn" id="today-back" type="button">← 返回词库</button>
      <h2 class="view-title">今日学习</h2>
      <div id="today-panel" class="today-panel"></div>
    </div>

    <!-- 词库：某分类下的书列表 -->
    <div id="books-view" style="display:none;">
      <button class="back-btn" id="books-back" type="button">← 返回分类</button>
      <h2 class="view-title" id="books-title"></h2>
      <div class="search-bar">
        <input type="search" id="books-search" placeholder="过滤词书…" autocomplete="off">
      </div>
      <div id="books-list" class="books-list"></div>
    </div>

    <!-- 词库：词表 -->
    <div id="book-view" style="display:none;">
      <button class="back-btn" id="book-back" type="button">← 返回词书</button>
      <h2 class="view-title" id="book-title"></h2>
      <div class="book-meta" id="book-meta"></div>
      <div class="book-toolbar">
        <div class="search-bar book-search-wrap">
          <input type="search" id="word-search" placeholder="搜索单词…" autocomplete="off">
        </div>
        <label class="card-mode-toggle" title="卡片模式：大卡片翻面记词">
          <input type="checkbox" id="card-mode-toggle">
          <span>卡片模式</span>
        </label>
      </div>
      <div id="word-list" class="word-list"></div>
      <div id="card-mode-panel" class="card-mode-panel" style="display:none;">
        <div id="flash-card" class="flash-card" tabindex="0">
          <div class="flash-front">
            <div class="flash-word" id="flash-word"></div>
            <div class="flash-hint">点按翻面</div>
          </div>
          <div class="flash-back">
            <div class="flash-word-sm" id="flash-word-back"></div>
            <div class="flash-ipa" id="flash-ipa"></div>
            <div class="flash-def" id="flash-def"></div>
            <div class="flash-example" id="flash-example"></div>
          </div>
        </div>
        <div class="flash-nav">
          <button type="button" id="flash-prev" class="pager-btn">上一词</button>
          <div class="pager-info" id="flash-pos"></div>
          <button type="button" id="flash-next" class="pager-btn">下一词</button>
        </div>
        <div class="flash-actions">
          <button type="button" id="flash-speak" class="btn-secondary">发音</button>
          <button type="button" id="flash-save" class="btn-primary">加入生词本</button>
        </div>
      </div>
      <div class="pager" id="word-pager"></div>
    </div>

    <!-- 点读：外壳（子 Tab：新概念 / 我的教材） -->
    <div id="listen-view" style="display:none;">
      <div class="sub-tabs" id="listen-sub-tabs">
        <button type="button" class="sub-tab active" data-sub="nce">新概念</button>
        <button type="button" class="sub-tab" data-sub="materials">我的教材</button>
      </div>
      <div id="nce-pane">
        <div class="book-tabs" id="book-tabs"></div>
        <div class="lesson-list" id="lesson-list"></div>
      </div>
      <div id="materials-pane" style="display:none;">
        <div class="materials-intro">
          <p>导入你自己拥有的正版 <strong>.mp3</strong> 与同名 <strong>.lrc</strong>（成对），存于本机 IndexedDB，不上传服务器。四级 / 星火等请自备正版音频，本站不提供整包拷贝。</p>
          <label class="btn-primary import-btn">
            导入 MP3 + LRC
            <input type="file" id="materials-file" accept=".mp3,.m4a,.wav,.ogg,.lrc,audio/*,text/plain" multiple hidden>
          </label>
        </div>
        <div id="materials-list" class="lesson-list"></div>
      </div>
    </div>

    <!-- 点读：播放器（新概念 + 我的教材共用） -->
    <div id="reader-view" class="reader">
      <button class="back-btn" id="back-btn" type="button">← 返回</button>
      <div class="player-bar">
        <button id="play-btn" type="button" aria-label="播放">▶</button>
        <div class="info">
          <div id="lesson-title" class="lesson-title"></div>
          <div class="hint">点句子跳转 · 点单词查词</div>
        </div>
        <button id="loop-btn" class="speed-btn" type="button" title="单句循环">↻</button>
        <button id="speed-btn" class="speed-btn" type="button">1x</button>
        <button id="shadow-mode-btn" class="speed-btn" type="button" title="跟读模式">跟读</button>
      </div>
      <div id="shadow-bar" class="shadow-bar" style="display:none;">
        <button type="button" id="shadow-listen" class="btn-secondary shadow-btn">听原音</button>
        <button type="button" id="shadow-rec" class="btn-primary shadow-btn">录音</button>
        <button type="button" id="shadow-play" class="btn-secondary shadow-btn" disabled>播放我的</button>
        <div class="shadow-hint" id="shadow-hint">先点选一句，再听原音 / 录音</div>
      </div>
      <div id="sentences"></div>
      <button id="mark-done" class="btn btn-primary mark-done" type="button">标记为已学完</button>
    </div>

    <div id="vocab-view" style="display:none;">
      <h2 class="view-title">我的生词本</h2>
      <div id="vocab-items"></div>
    </div>

    <div id="review-view" style="display:none;">
      <h2 class="view-title">今日复习</h2>
      <div id="review-items"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button data-tab="vault" class="active" type="button">
      <span class="icon">📚</span>词库
    </button>
    <button data-tab="listen" type="button">
      <span class="icon">🎧</span>点读
    </button>
    <button data-tab="vocab" type="button">
      <span class="icon">📝</span>生词
    </button>
    <button data-tab="review" type="button">
      <span class="icon">🔄</span>复习
    </button>
  </nav>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-word-row">
        <h3 id="modal-word"></h3>
        <button type="button" id="speak-btn" class="speak-btn" title="发音">🔊 发音</button>
      </div>
      <div class="ipa" id="modal-ipa"></div>
      <div class="def" id="modal-def"></div>
      <div class="example" id="modal-example"></div>
      <div class="actions">
        <button class="btn-secondary" id="close-modal" type="button">关闭</button>
        <button class="btn-primary" id="save-btn" type="button">加入生词本</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="js/lrc.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/materials.js"></script>
  <script src="js/vocab.js"></script>
  <script src="js/player.js"></script>
  <script src="js/path.js"></script>
  <script src="js/shadow.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/book.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    }
  </script>
</body>
</html>
